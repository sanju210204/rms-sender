name: Send RMS Data

on:
  # schedule:
  #   - cron: "0,30 1-12 * * *"
  workflow_dispatch:

jobs:
  send-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run sender
        run: python send_rms_data.py

      - name: Commit and push logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A logs/
          git diff --staged --quiet || git commit -m "Update RMS send logs $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
